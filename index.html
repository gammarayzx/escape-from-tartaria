<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESCAPE FROM TARTARIA - 40 TRACKS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='60' font-size='50' text-anchor='middle' fill='white'>◬</text></svg>">
<style>
html,body{margin:0;background:#000;color:#fff;font-family:monospace;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#nes{width:256px;height:240px;background:#000;border:4px solid #fff;position:relative;overflow:hidden;image-rendering:pixelated}
#screen{width:100%;height:100%;padding:6px;box-sizing:border-box;overflow:auto;filter:grayscale(1) contrast(1.4)}
h1{font-size:11px;text-align:center;border-bottom:2px solid #fff;margin:2px 0;padding:2px}
.mono-img{width:100%;height:48px;object-fit:cover;filter:grayscale(1) contrast(1.6);border:2px solid #fff;image-rendering:pixelated}
.section{font-size:8px;line-height:10px;white-space:pre-wrap}
button{width:100%;background:#000;color:#fff;border:2px solid #fff;font-family:monospace;font-size:7px;padding:4px;margin:2px 0;text-align:left;cursor:pointer}
button:hover{background:#fff;color:#000}
.char-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.char-card{border:1px solid #fff;padding:1px;text-align:center;font-size:7px}
#nes::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(transparent 0 2px,rgba(255,255,255,0.05) 2px 3px);pointer-events:none}
@media(min-width:500px){#nes{transform:scale(2)}} @media(min-width:900px){#nes{transform:scale(3)}}
</style>
</head>
<body>
<div id="nes"><div id="screen">LOADING 40 TRACKS...</div></div>
<script>
// --- AUDIO ENGINE - 40 FREE CC0 TRACKS ---
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t='square',v=0.14){try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();setTimeout(()=>o.stop(),d)}catch(e){}}
let musicInt=null, curTrack=0;
const FREE_TRACKS=[ // all original CC0 - dramatic sci-fi 8-bit
{name:"00 TITLE - TARTARIA DAWN",notes:[262,330,392,523,392,330,262,196],bpm:220},
{name:"01 NEON RUINS",notes:[220,262,330,262,220,196,220,330],bpm:200},
{name:"02 AUTHORITY SPIRE",notes:[110,130,165,130,110,98,110,165],bpm:180},
{name:"03 UNDERGROUND HUM",notes:[65,78,98,78,65,62,65,98],bpm:160},
{name:"04 AI AWAKENS",notes:[440,523,659,523,440,392,440,659],bpm:210},
{name:"05 TIME SLIP",notes:[330,370,415,370,330,294,330,415],bpm:230},
{name:"06 SPACE LAUNCH",notes:[196,246,294,392,294,246,196,294],bpm:240},
{name:"07 DIM CROSS",notes:[185,220,277,220,185,165,185,277],bpm:190},
{name:"08 MARKED PATROL",notes:[110,110,130,110,110,98,110,130],bpm:170},
{name:"09 FREE SOULS",notes:[262,294,330,294,262,247,262,330],bpm:200},
{name:"10 CRYSTAL CAVERN",notes:[523,659,783,659,523,493,523,659],bpm:180},
{name:"11 ANCIENT VESSEL",notes:[130,165,196,165,130,123,130,196],bpm:200},
{name:"12 STAR ALLIES",notes:[330,392,493,392,330,311,330,493],bpm:220},
{name:"13 VOID ECHO",notes:[55,65,82,65,55,51,55,82],bpm:150},
{name:"14 TARTARIA LOST",notes:[220,246,277,246,220,207,220,277],bpm:190},
{name:"15 REBELLION",notes:[147,185,220,185,147,139,147,220],bpm:210},
{name:"16 STEALTH",notes:[98,98,110,98,98,92,98,110],bpm:160},
{name:"17 HANGAR BAY",notes:[65,82,98,82,65,61,65,98],bpm:170},
{name:"18 SUN BENEATH SEA",notes:[262,330,392,330,262,294,330,392],bpm:180},
{name:"19 COMPLIANCE FALLS",notes:[392,493,587,493,392,370,392,587],bpm:230},
{name:"20-40 MORE DRAMA",notes:[130,155,185,155,130,116,130,185],bpm:200},
];
// generate 20 more variations to hit 40
for(let i=21;i<=40;i++){FREE_TRACKS.push({name:(i<10?"0":"")+i+" DEEP SECTOR "+i,notes:[110+(i*2),130+(i*2),165+(i*2),196+(i*2),165+(i*2),130+(i*2),110+(i*2),98+(i*2)],bpm:180+i})}

function playTrack(n){
  clearInterval(musicInt); curTrack=n%FREE_TRACKS.length;
  let t=FREE_TRACKS[curTrack], idx=0;
  document.getElementById('trackLabel').textContent=t.name;
  musicInt=setInterval(()=>{
    beep(t.notes[idx%t.notes.length], t.bpm/2, idx%4==0?'square':'triangle', idx%4==0?0.16:0.09);
    idx++;
  }, t.bpm);
}
function nextTrack(){playTrack(curTrack+1)}

// --- FIXED VOICE SYSTEM ---
let synth=window.speechSynthesis, voices=[], selectedVoice=null;
function loadVoices(){voices=synth.getVoices(); if(voices.length>0) {if(document.getElementById('screen').innerHTML.includes('SELECT VOICE')) showVoice();}}
if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
setTimeout(loadVoices,600);
function speak(t){if(!synth)return;synth.cancel();let u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,'').slice(0,180));u.rate=0.82;u.pitch=0.88;if(selectedVoice)u.voice=selectedVoice;else if(voices[0])u.voice=voices[0];synth.speak(u);}

// --- GAME ---
let player=null,current=1;
const characters=Array.from({length:12},(_,i)=>({name:"HERO "+(i+1),role:["LEADER","SCI","WAR","SCOUT","EX-MARK","MYSTIC","ENG","DIPLO","SMUG","MED","HIST","PILOT"][i]}));
const story={
1:{text:"[MONO MOVIE]\nTARTARIA // 8-BIT\nSUN BENEATH SEA\n40 FREE TRACKS",img:"https://picsum.photos/id/1015/256/48",choices:[{text:"START",next:10}]},
10:{text:"RUINS. SPIRE FAR.",choices:[{text:"GO UNDERGROUND",next:70}]},
70:{text:"UNDERGROUND CITY\nAI VESSELS\nTIME/SPACE/DIM",img:"https://picsum.photos/id/1016/256/48",choices:[{text:"BOARD VESSEL",next:100}]},
100:{text:"VESSEL ONLINE\nTIME/SPACE/DIM",choices:[{text:"TIME",next:150},{text:"SPACE",next:160},{text:"DIM",next:170},{text:"FREE TARTARIA",next:180}]},
150:{text:"TIME VICTORY",choices:[{text:"AGAIN",next:1}]},160:{text:"SPACE VICTORY",choices:[{text:"AGAIN",next:1}]},170:{text:"DIM VICTORY",choices:[{text:"AGAIN",next:1}]},180:{text:"ULTIMATE VICTORY",choices:[{text:"AGAIN",next:1}]},
};

function showChars(){
 let h=`<h1>ESCAPE FROM TARTARIA</h1><div id="trackLabel" style="font-size:6px;border:1px solid #fff;padding:2px;margin:2px 0">TRACK: ${FREE_TRACKS[0].name}</div><div style="display:flex;gap:2px"><button onclick="playTrack(0)" style="font-size:6px">TITLE THEME</button><button onclick="nextTrack()" style="font-size:6px">NEXT TRACK [${FREE_TRACKS.length}]</button></div><div class="char-grid">`;
 characters.forEach((c,i)=>{h+=`<div class="char-card"><div>◬</div><button onclick="selectChar(${i})">${c.name}<br>${c.role}</button></div>`});
 h+=`</div>`;document.getElementById('screen').innerHTML=h; playTrack(0);
}
window.selectChar=function(i){player=characters[i];beep(800,60);showVoice()}
function showVoice(){
 let h=`<h1>SELECT NARRATOR - FIXED</h1>`;
 if(voices.length===0){h+=`<div style="font-size:7px">Voices loading... Chrome needs a tap</div><button onclick="loadVoices()">RELOAD VOICES</button>`;}
 else voices.slice(0,8).forEach((v,i)=>{h+=`<button onclick="testVoice(${i})">${v.name.slice(0,22)}</button>`});
 h+=`<button onclick="startGame()">[BEGIN + GAME MUSIC]</button><button onclick="nextTrack()">[SKIP MUSIC TRACK]</button>`;
 document.getElementById('screen').innerHTML=h;
}
window.testVoice=function(i){if(voices[i]){selectedVoice=voices[i];beep(600,80);speak("Escape from Tartaria. Voice test. Track "+FREE_TRACKS[curTrack].name);}}
function startGame(){playTrack(1);current=1;render()}
function render(){
 let sec=story[current]||story[1];
 let html=`<div class="section">${sec.text}</div>`;
 if(sec.img)html+=`<img class="mono-img" src="${sec.img}">`;
 html+=`<div style="font-size:6px">♪ ${FREE_TRACKS[curTrack].name} <button onclick="nextTrack()" style="font-size:6px;padding:1px">NEXT</button></div>`;
 sec.choices.forEach(c=>{html+=`<button onclick="goTo(${c.next})">> ${c.text}</button>`});
 document.getElementById('screen').innerHTML=html; beep(500,20); speak(sec.text);
}
window.goTo=function(n){current=n; if(n>=100) playTrack(n%FREE_TRACKS.length); render()}

showChars(); loadVoices();
</script>
</body>
</html>
