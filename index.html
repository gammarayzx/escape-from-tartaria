<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESCAPE FROM TARTARIA - CHOOSE YOUR ADVENTURE BOOK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,[STRIPPED]">
<style>
html,body{margin:0;background:#0f0f1a;color:#fff;font-family:monospace;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#book{width:256px;height:240px;background:#f5f0d0;color:#000;border:4px solid #fff;position:relative;box-shadow:0 0 0 4px #000,0 0 0 8px #fff;display:flex;flex-direction:column}
#header{height:18px;background:#000;color:#fff;font-size:7px;padding:3px;box-sizing:border-box;display:flex;justify-content:space-between}
#page{flex:1;padding:8px;overflow:auto;font-size:8px;line-height:11px;white-space:pre-wrap;background:#f5f0d0;color:#000}
#choices{padding:4px;background:#000;display:flex;flex-direction:column;gap:2px;min-height:70px}
.choice{width:100%;background:#000;color:#fff;border:2px solid #fff;font-family:monospace;font-size:7px;padding:5px;text-align:left;cursor:pointer}
.choice:hover,.choice.sel{background:#fff;color:#000}
#controls{height:14px;background:#000;color:#fff;font-size:6px;padding:2px;display:flex;justify-content:space-between}
button.small{width:auto;padding:2px 4px;font-size:6px;border:1px solid #fff}
@media(min-width:520px){#book{transform:scale(2.2)}} @media(min-width:900px){#book{transform:scale(3)}}
</style>
</head>
<body>
<div id="book">
<div id="header"><span id="hTitle">TARTARIA BOOK</span><span id="hPage">P 1</span></div>
<div id="page">Loading book...</div>
<div id="choices"></div>
<div id="controls"><span>♪ AUTO | A=OK B=Back</span><span><button class="small" onclick="toggleRead()">🔊 AUTO-READ ON</button> <button class="small" onclick="nextTrack()">♪</button></span></div>
</div>
<audio id="music" loop preload="auto"></audio>
<script>
// --- AUTO MP3 BOOK MUSIC ---
const MP3={
 title:"https://cdn.pixabay.com/download/audio/2022/03/15/audio_3a9f6dbaf0.mp3",
 ruins:"https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8e8c5a3.mp3",
 underground:"https://cdn.pixabay.com/download/audio/2022/03/09/audio_c01cc7a963.mp3",
 vessel:"https://cdn.pixabay.com/download/audio/2022/03/10/audio_24f0b90e18.mp3",
 battle:"https://cdn.pixabay.com/download/audio/2022/01/18/audio_7cc04957e7.mp3",
 victory:"https://cdn.pixabay.com/download/audio/2022/03/10/audio_49a54d836e.mp3"
};
let curM=null,mOn=false, mIdx=0;
const mKeys=Object.keys(MP3);
function playM(k){ if(curM===k) return; curM=k; const a=document.getElementById('music'); a.src=MP3[k]; a.volume=0.4; if(mOn) a.play().catch(()=>{}); }
function nextTrack(){ mIdx=(mIdx+1)%mKeys.length; playM(mKeys[mIdx]); }
function unlockM(){ if(!mOn){ mOn=true; document.getElementById('music').play().catch(()=>{}); } }

// --- AUTO-READ (FIXED VOICES) ---
let synth=window.speechSynthesis, voices=[], autoRead=true, reading=false;
function loadVoices(){ voices=synth.getVoices(); }
if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
setTimeout(loadVoices,600);
function speakBook(t){
 if(!autoRead) return;
 synth.cancel();
 let u=new SpeechSynthesisUtterance(t.slice(0,400));
 u.rate=0.9; u.pitch=0.95;
 if(voices.length) u.voice=voices.find(v=>v.lang.startsWith('en'))||voices[0];
 synth.speak(u);
}
function toggleRead(){ autoRead=!autoRead; document.querySelector('#controls button').textContent=autoRead?'🔊 AUTO-READ ON':'🔇 AUTO-READ OFF'; if(!autoRead) synth.cancel(); }

// --- BOOK DATA - 22 PAGES ---
const BOOK={
1:{title:"COVER",music:"title",text:"ESCAPE FROM TARTARIA\nA Choose Your Own Adventure Book\n\nThe sun beneath the sea still pulses.\nAuthority says Tartaria never existed.\nYou know better.\n\nBy Jon Lanham - Fiction\n\nPress A / Click to open.",choices:[{text:"OPEN BOOK",next:2}]},
2:{title:"PAGE 1 - RUINS",music:"ruins",text:"Page 1 - The Ruins Edge\n\nYou stand at the edge of the white ruins. The Authority Spire hums 2km away, scanning.\nYour scanner shows a heat signature below - older than the Spire.\n\nAn old survivor whispers: 'They built a city beneath before we had language.'",choices:[{text:"Go stealth through ruins",next:3},{text:"Talk to survivor",next:4},{text:"Run straight to Spire",next:5}]},
3:{title:"PAGE 2 - GHOST",music:"ruins",text:"Page 2 - Ghost Through Ruins\n\nYou move like a shadow. Patrol drones pass overhead.\nYou hear their chatter: 'Deep city still powered. Do not enter.'\n\nYou find a cracked stairwell going down, light pulsing white.",choices:[{text:"Descend the stairwell",next:6},{text:"Hide and listen more",next:4}]},
4:{title:"PAGE 3 - SURVIVOR",music:"ruins",text:"Page 3 - The Survivor\n\n'Tunnels are not tunnels,' she says. 'They are roots of a machine. Before species, they left vessels that can fold time, space, dimension.'\n\nShe presses a cold crystal into your hand. It hums.",choices:[{text:"Take crystal and go underground",next:6},{text:"Ask about vessels",next:7}]},
5:{title:"PAGE 4 - SPIRE",music:"battle",text:"Page 4 - Authority Spire\n\nGuards. Too many. A service hatch hisses open behind you - someone left it for you.\n\nInside, pipes lead down.",choices:[{text:"Enter hatch",next:6},{text:"Surrender and bluff",next:8}]},
6:{title:"PAGE 5 - UNDERGROUND",music:"underground",text:"Page 5 - Underground City Found\n\nWhite crystals light a city larger than any on surface. Silent machines float. In the hangar, three vessels sleep.\n\nA wall reads: WE LEFT BEFORE SPECIES. TIME SPACE DIMENSION OPEN.",choices:[{text:"Go to Central Chamber",next:9},{text:"Go to Vehicle Bay",next:10}]},
7:{title:"PAGE 6 - VESSELS",music:"underground",text:"Page 6 - The Vessels\n\n'Time vessel can prevent the Mark. Space vessel can call our star allies. Dimension vessel can pull us into a free dimension,' she says.\n\n'Which would you choose?'",choices:[{text:"I need to see them first",next:6}]},
8:{title:"PAGE 7 - CAPTURED",music:"battle",text:"Page 7 - Captured\n\nThey mark you. But the crystal in your pocket burns - it teleports you down anyway. You wake in the crystal city, free of the mark.",choices:[{text:"Stand up",next:6}]},
9:{title:"PAGE 8 - CHAMBER",music:"underground",text:"Page 8 - Central Chamber\n\nA floating AI speaks without sound: 'You are unmarked. You may board. Choose: Time will change past. Space will call future. Dimension will change now.'",choices:[{text:"Board vessel",next:11}]},
10:{title:"PAGE 9 - BAY",music:"underground",text:"Page 9 - Vehicle Bay\n\nVessel opens like a hand. Inside, no controls - only intention. It asks where you want Tartaria to be free.",choices:[{text:"Enter vessel",next:11}]},
11:{title:"PAGE 10 - CHOICE",music:"vessel",text:"Page 10 - The Choice\n\nThe vessel is online. This is the heart of the book.\n\nTIME: Go back and stop Authority before it starts.\nSPACE: Launch and bring star allies.\nDIMENSION: Thin the veil and shift Tartaria into a free dimension.\nRETURN: Take this tech back and free Tartaria now.",choices:[{text:"TIME TRAVEL",next:12},{text:"SPACE LAUNCH",next:13},{text:"DIMENSION CROSS",next:14},{text:"RETURN AND FREE TARTARIA",next:15}]},
12:{title:"PAGE 11 - TIME",music:"vessel",text:"Page 11 - Time\n\nYou slip before the Spire was built. You leave the crystal in the foundation - it grows into a flaw. History cracks.\n\nYou wake. Tartaria never fell.",choices:[{text:"Read ending",next:16}]},
13:{title:"PAGE 12 - SPACE",music:"vessel",text:"Page 12 - Space\n\nYou launch. Stars you never saw. You broadcast the crystal frequency.\n\nLights answer - thousands. They have been waiting.",choices:[{text:"Read ending",next:17}]},
14:{title:"PAGE 13 - DIMENSION",music:"vessel",text:"Page 13 - Dimension\n\nYou thin the world like paper. On the other side, Tartaria is free - towers white, sun beneath sea bright, no Spire.",choices:[{text:"Pull Tartaria through",next:18}]},
15:{title:"PAGE 14 - RETURN",music:"vessel",text:"Page 14 - Return\n\nYou return with a vessel in your pocket that builds vessels. People gather. For the first time, they see the Spire as small.",choices:[{text:"Final liberation",next:19}]},
16:{title:"ENDING - TIME",music:"victory",text:"ENDING 1: TIME VICTORY\n\nTartaria free in the past, so free in the present.\nChildren learn true history.\nThe sun beneath the sea rises.\n\n[Press A to read again]",choices:[{text:"READ AGAIN FROM START",next:1}]},
17:{title:"ENDING - SPACE",music:"victory",text:"ENDING 2: SPACE VICTORY\n\nAllies arrive in white ships. Spire falls from orbit.\nTartaria joins a free federation of worlds.\n\n[Press A to read again]",choices:[{text:"READ AGAIN FROM START",next:1}]},
18:{title:"ENDING - DIMENSION",music:"victory",text:"ENDING 3: DIMENSION VICTORY\n\nYou pull Tartaria into the free dimension.\nNo Authority. Only crystal cities.\n\n[Press A to read again]",choices:[{text:"READ AGAIN FROM START",next:1}]},
19:{title:"ENDING - ULTIMATE",music:"victory",text:"ENDING 4: ULTIMATE VICTORY\n\nYou free Tartaria with its own forgotten tech.\nPeople remember who built the world.\nSun beneath sea becomes sun above.\n\nThank you for reading.\nBy Jon Lanham\n\n[Press A to read again]",choices:[{text:"READ AGAIN FROM START",next:1}]},
};

let curPage=1, choiceSel=0;

function showPage(id){
 curPage=id;
 let p=BOOK[id];
 if(!p) return;
 document.getElementById('hTitle').textContent=p.title;
 document.getElementById('hPage').textContent="P "+id;
 document.getElementById('page').textContent=p.text;
 playM(p.music);
 speakBook(p.text);
 // choices clickable
 const cDiv=document.getElementById('choices');
 cDiv.innerHTML='';
 choiceSel=0;
 p.choices.forEach((c,i)=>{
  let b=document.createElement('button');
  b.className='choice'+(i===0?' sel':'');
  b.textContent=(i+1)+". "+c.text;
  b.onclick=()=>{ unlockM(); showPage(c.next); };
  cDiv.appendChild(b);
 });
}

function moveChoice(d){
 const btns=document.querySelectorAll('.choice');
 if(btns.length===0) return;
 btns[choiceSel].classList.remove('sel');
 choiceSel=(choiceSel+d+btns.length)%btns.length;
 btns[choiceSel].classList.add('sel');
}
function confirmChoice(){
 const btns=document.querySelectorAll('.choice');
 if(btns[choiceSel]) btns[choiceSel].click();
}

// CONTROLS DOUBLE CHECKED
window.addEventListener('keydown',e=>{
 unlockM();
 if(['ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
 if(e.key==='ArrowUp'||e.key==='w') moveChoice(-1);
 if(e.key==='ArrowDown'||e.key==='s') moveChoice(1);
 if(e.key==='Enter'||e.key===' '||e.key==='a'||e.key==='A') confirmChoice();
});

let pad=null, lastB=[];
window.addEventListener("gamepadconnected",e=>{pad=e.gamepad.index;});
setInterval(()=>{
 if(pad===null){ const gps=navigator.getGamepads(); for(let i=0;i<gps.length;i++) if(gps[i]) pad=i; }
 if(pad!==null){
  const g=navigator.getGamepads()[pad]; if(!g) return;
  let ay=g.axes[1];
  if(ay<-0.6 &&!lastB.axUp){ moveChoice(-1); lastB.axUp=true; } else if(ay>-0.3) lastB.axUp=false;
  if(ay>0.6 &&!lastB.axDown){ moveChoice(1); lastB.axDown=true; } else if(ay<0.3) lastB.axDown=false;
  if(g.buttons[12]?.pressed &&!lastB[12]) moveChoice(-1);
  if(g.buttons[13]?.pressed &&!lastB[13]) moveChoice(1);
  if(g.buttons[0]?.pressed &&!lastB[0]) confirmChoice();
  if(g.buttons[1]?.pressed &&!lastB[1]){ /* back */ if(curPage>1) showPage(curPage-1); }
  lastB=g.buttons.map(b=>b.pressed);
  if(g.buttons.some(b=>b.pressed)) unlockM();
 }
},90);

showPage(1);
</script>
</body>
</html>
